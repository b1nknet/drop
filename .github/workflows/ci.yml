name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.14
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: false
          # Gitea's job token cannot authenticate to GitHub releases.
          github-token: ''
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Run tests
        run: uv run --locked python -m pytest -q

  web:
    name: Web lint and formatting
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          token: ''
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint:web
      - name: Check web and configuration formatting
        run: npm run format:check:web
