<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101622" />
    <title>내 파일 · drop</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <script src="/assets/theme.js"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body class="dashboard-body">
    <a class="skip-link" href="#main">본문으로 이동</a>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          <span>내 공간</span><span class="slash">/</span><strong>모든 파일</strong>
        </div>
        <div class="topbar-actions">
          <button
            class="text-button theme-toggle"
            type="button"
            aria-label="라이트 모드로 전환"
            title="라이트 모드로 전환"
          >
            <svg class="theme-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            <svg class="theme-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
            <span data-theme-label>라이트 모드</span>
          </button>
          <button id="logout" class="text-button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m6-13 5 5-5 5m-7-5h12"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              /></svg
            >로그아웃
          </button>
        </div>
      </header>
      <main id="main" class="main-content">
        <section id="dropzone" class="dropzone" aria-labelledby="drop-title">
          <div class="upload-symbol">
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <path
                d="M16 21V6m-6 6 6-6 6 6M7 20v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h2 id="drop-title">여기에 파일을 놓아주세요</h2>
          <p>파일을 끌어다 놓거나 아래 버튼으로 선택하세요.</p>
          <button id="choose-files" class="primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              /></svg
            >파일 선택
          </button>
          <input type="file" id="file-input" multiple hidden />
          <span id="upload-limit" class="upload-hint">여러 파일을 한 번에 업로드할 수 있어요</span>
        </section>
        <section id="upload-panel" class="upload-panel" aria-labelledby="upload-title" hidden>
          <div class="upload-panel-heading">
            <h2 id="upload-title">업로드</h2>
            <button id="clear-uploads" class="text-button" type="button">완료 항목 지우기</button>
          </div>
          <ul id="upload-list" class="upload-list"></ul>
        </section>
        <section class="files-section" aria-labelledby="files-title">
          <div class="files-heading">
            <div class="files-title">
              <h2 id="files-title">내 파일</h2>
              <span id="file-count" class="count-badge">0</span>
            </div>
            <span id="total-size" class="muted">총 0 B</span>
          </div>
          <div class="file-toolbar">
            <div class="search-field">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7" />
                <path
                  d="m16 16 4 4"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                /></svg
              ><input
                id="search"
                type="search"
                placeholder="파일 이름으로 검색"
                aria-label="파일 이름으로 검색"
              />
            </div>
            <div class="toolbar-actions">
              <select id="sort" aria-label="파일 정렬">
                <option value="newest">최근 업로드순</option>
                <option value="name">이름순</option>
                <option value="size">큰 파일순</option></select
              ><button
                id="refresh"
                class="icon-button"
                type="button"
                aria-label="파일 목록 새로고침"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M20 7v5h-5M4 17v-5h5"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>
          <p id="list-error" class="list-error" role="alert" hidden></p>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">파일 이름</th>
                  <th scope="col">크기</th>
                  <th scope="col">업로드 날짜</th>
                  <th scope="col"><span class="sr-only">다운로드 및 삭제</span></th>
                </tr>
              </thead>
              <tbody id="file-list"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-symbol">
              <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
                <path
                  d="M7 12a2 2 0 0 1 2-2h9l3 4h10a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V12Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M16 23h8m-4-4v8"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <h3 id="empty-title">아직 보관한 파일이 없어요</h3>
            <p id="empty-copy">첫 번째 파일을 올려보세요.</p>
          </div>
          <div class="table-footer">
            <span id="list-summary" role="status">파일 목록을 불러오는 중…</span>
          </div>
        </section>
        <footer class="main-footer"><span class="footer-brand">drop.</span></footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
