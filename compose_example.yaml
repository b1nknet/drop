services:
  drive:
    image: ${DROP_IMAGE:-ghcr.io/b1nknet/drop:stable}
    restart: unless-stopped
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    ports:
      - '${PORT:-8080}:8000'
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?먼저 .env에 12글자 이상의 APP_PASSWORD를 설정하세요}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # source를 /srv/my-files 같은 호스트 경로로 바꾸어도 됩니다.
      - type: bind
        source: ${UPLOAD_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
